<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chain - Secure Messaging</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Dots&display=swap" rel="stylesheet">
  <style>
    /* ========== THEMES ========== */
    :root[data-theme="light"]{
      --bg:#f5f5f5;
      --surface:rgba(240, 240, 240, 0.7);
      --glass-bg:rgba(255, 255, 255, 0.6);
      --glass-border:rgba(0, 0, 0, 0.1);
      --surface-elevated:#ffffff;
      --text:#000000;
      --text-secondary:#666666;
      --text-muted:#999999;
      --accent:#2d2d2d;
      --accent-hover:#000000;
      --border:rgba(0,0,0,0.1);
      --shadow:rgba(0,0,0,0.1);
      --divider:rgba(0,0,0,0.08);
      --overlay:rgba(0, 0, 0, 0.5);
      --gradient-start:#ffffff;
      --gradient-end:#e0e0e0;
    }
    
    :root[data-theme="dark"]{
      --bg:#000000;
      --surface:rgba(30, 30, 30, 0.7);
      --glass-bg:rgba(20, 20, 20, 0.6);
      --glass-border:rgba(255, 255, 255, 0.1);
      --surface-elevated:#1a1a1a;
      --text:#ffffff;
      --text-secondary:#b3b3b3;
      --text-muted:#737373;
      --accent:#ffffff;
      --accent-hover:#e6e6e6;
      --border:rgba(255,255,255,0.1);
      --shadow:rgba(0,0,0,0.5);
      --divider:rgba(255,255,255,0.08);
      --overlay:rgba(0, 0, 0, 0.7);
      --gradient-start:#1a1a1a;
      --gradient-end:#000000;
    }
    
    /* ========== BASE ========== */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      transition:background 0.3s ease, color 0.3s ease;
    }
    
    /* ========== GLASSMORPHISM ========== */
    .glass {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
    }
    
    .glass-strong {
      background:var(--glass-bg);
      backdrop-filter:blur(30px);
      -webkit-backdrop-filter:blur(30px);
      border:1px solid var(--glass-border);
    }
    
    /* ========== LAYOUT ========== */
    .designer {
      display:grid;
      grid-template-columns: 420px 1fr;
      height:100vh;
      overflow:hidden;
    }
    
    .preview-panel {
      background:var(--surface);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:40px 24px;
      overflow:auto;
    }
    
    .phone {
      background:var(--surface-elevated);
      border-radius:40px;
      padding:20px;
      width:100%;
      max-width:380px;
      height:800px;
      box-shadow:0 20px 60px var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border:2px solid var(--border);
    }
    
    .screen {
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:auto;
      background:var(--bg);
      border-radius:28px;
      position:relative;
    }
    
    .phone-controls {
      padding:20px 0 0 0;
      display:flex;
      gap:12px;
    }
    
    .canvas-panel {
      background:var(--bg);
      padding:40px;
      overflow:auto;
    }
    
    .canvas-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:40px;
      padding-bottom:24px;
      border-bottom:1px solid var(--border);
    }
    
    .logo-main {
      width:48px;
      height:48px;
      margin-right:16px;
    }
    
    .canvas-title {
      font-size:32px;
      font-weight:400;
      font-family:'Zen Dots', cursive;
      color:var(--text);
      display:flex;
      align-items:center;
    }
    
    .screen-tabs {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:32px;
    }
    
    .tab {
      padding:12px 20px;
      border-radius:12px;
      background:transparent;
      color:var(--text-secondary);
      border:1px solid var(--border);
      cursor:pointer;
      transition:all 0.2s ease;
      font-size:14px;
      font-weight:500;
    }
    
    .tab:hover {
      background:var(--surface);
      color:var(--text);
    }
    
    .tab.active {
      background:var(--accent);
      color:var(--bg);
      border-color:var(--accent);
    }
    
    /* ========== ICONS ========== */
    .icon {
      display:inline-block;
      width:20px;
      height:20px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    
    /* ========== UI COMPONENTS ========== */
    .header {
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      padding:16px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:10;
      background:linear-gradient(to bottom, var(--glass-bg) 0%, var(--glass-bg) 70%, transparent 100%);
      border-bottom:1px solid var(--glass-border);
    }
    
    .header-left {
      display:flex;
      align-items:center;
      gap:12px;
    }
    
    .header-right {
      display:flex;
      align-items:center;
      gap:12px;
    }
    
    .icon-btn {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      color:var(--text);
      cursor:pointer;
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      transition:all 0.2s ease;
    }
    
    .icon-btn:hover {
      background:var(--surface);
      transform:scale(1.05);
    }
    
    .icon-btn:active {
      transform:scale(0.95);
    }
    
    .btn {
      padding:16px 32px;
      border-radius:16px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:all 0.2s ease;
      border:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    
    .btn-primary {
      background:var(--accent);
      color:var(--bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    
    .btn-primary:hover {
      background:var(--accent-hover);
      transform:translateY(-2px);
      box-shadow:0 8px 24px var(--shadow);
    }
    
    .btn-primary:active {
      transform:translateY(0);
    }
    
    .btn-secondary {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:var(--text);
      border:1px solid var(--glass-border);
    }
    
    .btn-secondary:hover {
      background:var(--surface);
    }
    
    .input {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      color:var(--text);
      padding:16px 20px;
      border-radius:16px;
      font-size:16px;
      width:100%;
      transition:all 0.2s ease;
      font-family:inherit;
    }
    
    .input:focus {
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(255,255,255,0.1);
    }
    
    .input::placeholder {
      color:var(--text-muted);
    }
    
    /* ========== WELCOME SCREEN ========== */
    .welcome-container {
      flex:1;
      display:flex;
      flex-direction:column;
      padding:40px 24px 24px;
      background:linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    }
    
    .welcome-header {
      text-align:center;
      margin-bottom:auto;
      padding-top:20px;
    }
    
    .app-logo {
      width:120px;
      height:120px;
      margin:0 auto 24px;
      border-radius:30px;
      padding:20px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      box-shadow:0 8px 32px var(--shadow);
    }
    
    .app-logo img {
      width:100%;
      height:100%;
      object-fit:contain;
    }
    
    .welcome-title {
      font-size:42px;
      font-weight:800;
      font-family:'Zen Dots', cursive;
      margin-bottom:12px;
      letter-spacing:-0.5px;
    }
    
    .welcome-subtitle {
      font-size:16px;
      color:var(--text-secondary);
      line-height:1.5;
      max-width:280px;
      margin:0 auto;
    }
    
    .welcome-features {
      display:flex;
      flex-direction:column;
      gap:16px;
      margin-bottom:32px;
    }
    
    .feature-card {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      border-radius:20px;
      padding:20px;
      display:flex;
      align-items:center;
      gap:16px;
      transition:all 0.2s ease;
    }
    
    .feature-card:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 24px var(--shadow);
    }
    
    .feature-icon {
      width:48px;
      height:48px;
      border-radius:14px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }
    
    .feature-content {
      flex:1;
    }
    
    .feature-title {
      font-size:16px;
      font-weight:600;
      margin-bottom:4px;
    }
    
    .feature-desc {
      font-size:14px;
      color:var(--text-secondary);
      line-height:1.4;
    }
    
    .welcome-actions {
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    
    /* ========== AUTH SCREENS ========== */
    .auth-container {
      flex:1;
      display:flex;
      flex-direction:column;
      padding:60px 24px 24px;
      background:linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    }
    
    .auth-header {
      text-align:center;
      margin-bottom:40px;
    }
    
    .auth-icon {
      width:80px;
      height:80px;
      margin:0 auto 24px;
      border-radius:20px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 32px var(--shadow);
    }
    
    .auth-title {
      font-size:28px;
      font-weight:700;
      margin-bottom:8px;
    }
    
    .auth-subtitle {
      font-size:15px;
      color:var(--text-secondary);
      line-height:1.5;
    }
    
    .auth-form {
      display:flex;
      flex-direction:column;
      gap:16px;
      margin-bottom:24px;
    }
    
    .input-group {
      display:flex;
      gap:12px;
    }
    
    .country-select {
      position:relative;
    }
    
    .country-btn {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      color:var(--text);
      padding:16px;
      border-radius:16px;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      transition:all 0.2s ease;
      min-width:100px;
    }
    
    .country-btn:hover {
      background:var(--surface);
    }
    
    .country-dropdown {
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      right:0;
      background:var(--glass-bg);
      backdrop-filter:blur(30px);
      -webkit-backdrop-filter:blur(30px);
      border:1px solid var(--glass-border);
      border-radius:16px;
      max-height:240px;
      overflow-y:auto;
      display:none;
      z-index:100;
      box-shadow:0 8px 32px var(--shadow);
    }
    
    .country-dropdown.show {
      display:block;
    }
    
    .country-item {
      padding:12px 16px;
      cursor:pointer;
      transition:all 0.2s ease;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:15px;
    }
    
    .country-item:hover {
      background:var(--surface);
    }
    
    /* ========== OTP SCREEN ========== */
    .otp-boxes {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:24px;
    }
    
    .otp-box {
      width:56px;
      height:64px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:700;
      color:var(--text);
      transition:all 0.2s ease;
    }
    
    .otp-box:focus-within {
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(255,255,255,0.1);
    }
    
    .otp-input {
      width:100%;
      height:100%;
      border:none;
      background:transparent;
      text-align:center;
      font-size:28px;
      font-weight:700;
      color:var(--text);
      outline:none;
    }
    
    .otp-resend {
      text-align:center;
      margin-bottom:24px;
    }
    
    .otp-resend-text {
      font-size:14px;
      color:var(--text-secondary);
      margin-bottom:8px;
    }
    
    .link {
      color:var(--text);
      text-decoration:none;
      font-weight:600;
      cursor:pointer;
      transition:all 0.2s ease;
    }
    
    .link:hover {
      opacity:0.8;
    }
    
    .otp-test-buttons {
      display:flex;
      gap:8px;
    }
    
    /* ========== BIOMETRIC SCREEN ========== */
    .biometric-content {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:32px;
    }
    
    .biometric-icon-large {
      width:140px;
      height:140px;
      border-radius:28px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 12px 48px var(--shadow);
      animation:pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform:scale(1); opacity:1; }
      50% { transform:scale(1.05); opacity:0.9; }
    }
    
    .biometric-text {
      text-align:center;
    }
    
    .biometric-title {
      font-size:24px;
      font-weight:700;
      margin-bottom:12px;
    }
    
    .biometric-subtitle {
      font-size:15px;
      color:var(--text-secondary);
      line-height:1.5;
    }
    
    /* ========== CHAT SCREEN ========== */
    .chat-content {
      flex:1;
      overflow-y:auto;
      padding:20px;
    }
    
    .chat-list {
      display:flex;
      flex-direction:column;
      gap:0;
    }
    
    .chat-item {
      display:flex;
      padding:16px;
      gap:12px;
      cursor:pointer;
      transition:all 0.2s ease;
      border-radius:16px;
    }
    
    .chat-item:hover {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    
    .avatar {
      width:52px;
      height:52px;
      border-radius:16px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:16px;
      flex-shrink:0;
    }
    
    .chat-content-wrapper {
      flex:1;
      min-width:0;
    }
    
    .chat-header-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:6px;
    }
    
    .chat-name {
      font-size:16px;
      font-weight:600;
      color:var(--text);
    }
    
    .chat-time {
      font-size:13px;
      color:var(--text-muted);
    }
    
    .chat-last {
      font-size:14px;
      color:var(--text-secondary);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      gap:4px;
    }
    
    .unread-badge {
      background:var(--accent);
      color:var(--bg);
      width:24px;
      height:24px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:700;
      flex-shrink:0;
    }
    
    /* ========== CALL SCREEN ========== */
    .call-list {
      display:flex;
      flex-direction:column;
      gap:0;
    }
    
    .call-item {
      display:flex;
      padding:16px;
      gap:12px;
      align-items:center;
      transition:all 0.2s ease;
      border-radius:16px;
    }
    
    .call-item:hover {
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    
    .call-content {
      flex:1;
      min-width:0;
    }
    
    .call-icon {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:20px;
      height:20px;
      border-radius:10px;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
      margin-right:6px;
    }
    
    .call-icon.incoming {
      color:#00cc66;
    }
    
    .call-icon.outgoing {
      color:var(--text-secondary);
    }
    
    .call-icon.missed {
      color:#ff3333;
    }
    
    .call-meta {
      display:flex;
      gap:8px;
    }
    
    /* ========== BOTTOM NAV ========== */
    .bottom-nav {
      background:var(--glass-bg);
      backdrop-filter:blur(30px);
      -webkit-backdrop-filter:blur(30px);
      border-top:1px solid var(--glass-border);
      padding:12px 20px 16px;
      display:flex;
      justify-content:space-around;
      position:sticky;
      bottom:0;
    }
    
    .nav-item {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding:8px 20px;
      border-radius:12px;
      background:transparent;
      border:none;
      color:var(--text-secondary);
      cursor:pointer;
      transition:all 0.2s ease;
    }
    
    .nav-item:hover {
      color:var(--text);
      background:var(--glass-bg);
    }
    
    .nav-item.active {
      color:var(--text);
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    
    .nav-label {
      font-size:12px;
      font-weight:600;
    }
    
    /* ========== POPUP ========== */
    .popup-overlay {
      position:fixed;
      inset:0;
      background:var(--overlay);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1000;
      animation:fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn {
      from { opacity:0; }
      to { opacity:1; }
    }
    
    .popup {
      background:var(--glass-bg);
      backdrop-filter:blur(30px);
      -webkit-backdrop-filter:blur(30px);
      border:1px solid var(--glass-border);
      border-radius:24px;
      padding:32px;
      max-width:320px;
      text-align:center;
      box-shadow:0 20px 60px var(--shadow);
      animation:slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { transform:translateY(20px); opacity:0; }
      to { transform:translateY(0); opacity:1; }
    }
    
    .popup h2 {
      font-size:22px;
      font-weight:700;
      margin-bottom:8px;
    }
    
    .popup p {
      font-size:15px;
      color:var(--text-secondary);
      margin-bottom:24px;
      line-height:1.5;
    }
    
    .popup-icon {
      width:80px;
      height:80px;
      margin:0 auto 24px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid var(--glass-border);
    }
    
    .popup-icon.success {
      color:#00cc66;
    }
    
    .popup-icon.error {
      color:#ff3333;
    }
    
    /* ========== UTILITIES ========== */
    .text-center {
      text-align:center;
    }
    
    .mt-auto {
      margin-top:auto;
    }
    
    /* ========== CONTROL PANEL ========== */
    .control-btn {
      flex:1;
      padding:12px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--glass-bg);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:var(--text);
      cursor:pointer;

const screenInfo = {
  welcome: "Enhanced vertical welcome screen with app icon, gradient background, glassmorphic feature cards with blur effects on icons, and clear CTAs. Fully vertical orientation optimized for mobile viewing.",
  phone: "Phone verification with glassmorphic country selector and input field. All elements use consistent blur effects for a cohesive design language.",
  otp: "OTP verification with glassmorphic code boxes featuring blur backgrounds. Icon uses the same blur treatment. Test buttons included for demo purposes.",
  profile: "Profile setup with 'Display Name' title and 'satoshi' placeholder. Simple vertical layout with glassmorphic input field and consistent blur effects.",
  biometric: "Biometric security screen with large pulsing fingerprint icon in glassmorphic container. Centered vertical layout with clear action buttons at bottom.",
  chat: "Enhanced vertical chat screen with glassmorphic header, avatar backgrounds with blur effects, and improved list layout. Clean modern design with proper spacing.",
  calls: "Vertical call history with glassmorphic call indicators (incoming/green, outgoing/gray, missed/red) and quick call buttons. Consistent blur effects throughout."
};

function render() {
  const container = document.getElementById('screen-container');
  container.innerHTML = templates[current]();
  updateNav();
  updateScreenInfo();
  document.getElementById('currentScreen').textContent = current.charAt(0).toUpperCase() + current.slice(1);
}

function goto(screen) {
  current = screen;
  render();
}

function nextScreen() {
  const order = ['welcome','phone','otp','profile','biometric','chat','calls'];
  const idx = order.indexOf(current);
  current = order[(idx+1)%order.length];
  render();
}

function prevScreen() {
  const order = ['welcome','phone','otp','profile','biometric','chat','calls'];
  const idx = order.indexOf(current);
  current = order[(idx-1+order.length)%order.length];
  render();
}

function updateNav() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.screen === current);
  });
}

function updateScreenInfo() {
  document.getElementById('screenInfo').innerHTML = screenInfo[current] || '';
}

function toggleCountryDropdown(e) {
  e.stopPropagation();
  const dropdown = document.getElementById('countryDropdown');
  dropdown.classList.toggle('show');
}

function selectCountry(code, flag, name) {
  selectedCountry = {code, flag, name};
  document.getElementById('countryDropdown').classList.remove('show');
  render();
}

function showOtpSuccess() {
  const popup = document.createElement('div');
  popup.className = 'popup-overlay';
  popup.innerHTML = `
    <div class="popup">
      <div class="popup-icon success">
        <svg class="icon" style="width:40px;height:40px" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2>OTP Verified</h2>
      <p>Your phone number has been verified successfully</p>
      <button class="btn btn-primary" onclick="closePopup()">Continue</button>
    </div>
  `;
  document.body.appendChild(popup);
  setTimeout(() => {
    closePopup();
    goto('profile');
  }, 2000);
}

function showOtpError() {
  const popup = document.createElement('div');
  popup.className = 'popup-overlay';
  popup.innerHTML = `
    <div class="popup">
      <div class="popup-icon error">
        <svg class="icon" style="width:40px;height:40px" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>
      <h2>Invalid OTP</h2>
      <p>The code you entered is incorrect. Please try again</p>
      <button class="btn btn-primary" onclick="closePopup()">Try Again</button>
    </div>
  `;
  document.body.appendChild(popup);
}

function closePopup() {
  const popup = document.querySelector('.popup-overlay');
  if (popup) {
    popup.remove();
  }
}

function switchTab(tab) {
  currentTab = tab;
  if (tab === 'chats') {
    goto('chat');
  } else if (tab === 'calls') {
    goto('calls');
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('chain-theme', newTheme);
  
  const icon = document.getElementById('theme-icon');
  if (newTheme === 'light') {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  }
}

document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('countryDropdown');
  if (dropdown && !e.target.closest('.country-select')) {
    dropdown.classList.remove('show');
  }
});

const savedTheme = localStorage.getItem('chain-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
if (savedTheme === 'light') {
  document.getElementById('theme-icon').innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
}

render();
